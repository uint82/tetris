[package]
name = "tetris"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
rand = "0.10.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = true

[dev-dependencies]
tempfile = "3.27.0"
